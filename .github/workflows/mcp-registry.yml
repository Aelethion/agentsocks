name: mcp-registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish server.json to the MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: server.json describes the version package.json publishes
        run: node -e 'const p=require("./package.json"),s=require("./server.json");if(s.name!==p.mcpName||s.version!==p.version||s.packages[0].version!==p.version){console.error("server.json does not match package.json");process.exit(1)}'
      - name: install mcp-publisher
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: log in with this repository's GitHub identity
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'
      - name: publish
        run: '"$RUNNER_TEMP/mcp-publisher" publish'
